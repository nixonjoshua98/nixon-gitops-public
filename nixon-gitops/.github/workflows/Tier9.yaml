name: Tier9

on:
  repository_dispatch:
    types:
      - tier9.abo.worldchat
      - tier9.abo.slime
      - tier9.abo.api

permissions:
  contents: write

jobs:
  patch-image:
    uses: ./.github/workflows/Template.UpdateImage.yaml
    with:
      project: tier9
      environment: ${{ github.event.client_payload.environment }}
      action: ${{ github.event.action }}
      image: ${{ github.event.client_payload.image }}
