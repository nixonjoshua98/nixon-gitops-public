name: Template.Deployment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

      project:
        required: true
        type: string

      action:
        required: true
        type: string

      image:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: template-update-deployment-image
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ inputs.project }}
      ENVIRONMENT: ${{ inputs.environment }}
      ACTION: ${{ inputs.action }}
      IMAGE: ${{ inputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set $FILE_PATH_LOWER
        run: |
          FILE_PATH_LOWER="configuration/${PROJECT,,}/environments/${ENVIRONMENT,,}/$(echo "${ACTION,,}" | tr '.' '-').yaml"
          echo "FILE_PATH_LOWER=${FILE_PATH_LOWER}" >>${GITHUB_ENV}

      - name: Update image
        run: |
          sed -i "s|^image:.*|image: \"$IMAGE\"|" "$FILE_PATH_LOWER"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "$FILE_PATH_LOWER"
          git commit -m "chore: updated image for ${PROJECT}/${ACTION}" || echo "No changes to commit"
          git pull --rebase origin
          git push
