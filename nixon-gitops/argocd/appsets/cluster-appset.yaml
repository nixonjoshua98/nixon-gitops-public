apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-appset
  namespace: argocd
  labels:
    custom.kubernetes.io/is-adhoc: "true"
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/nixonjoshua98/nixon-gitops.git
              revision: main
              files:
                - path: "argocd/workloads/cluster.yaml"
          - list:
              elementsYaml: "{{ .components | toJson }}"
  template:
    metadata:
      name: "{{ .name }}"
      annotations:
        argocd.argoproj.io/manifest-generate-paths: "/charts/nixon-cronjob;/argocd/workloads/cluster.yaml;/configuration/base/values.yaml;/configuration/cluster/{{ .name }}.yaml"
    spec:
      project: default
      source:
        repoURL: https://github.com/nixonjoshua98/nixon-gitops.git
        targetRevision: main
        path: "{{ .chart }}"
        helm:
          releaseName: "{{ .name }}"
          ignoreMissingValueFiles: false
          valueFiles: ["/configuration/base/values.yaml", "/configuration/cluster/{{ .name }}.yaml"]
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
      syncPolicy:
        managedNamespaceMetadata:
          labels:
            custom.kubernetes.io/require-image-registry-secret: "true"
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - Prune=true
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - RespectIgnoreDifferences=true
