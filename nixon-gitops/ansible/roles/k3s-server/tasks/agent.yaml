- name: Build exec args
  ansible.builtin.set_fact:
    _k3s_exec_args: >-
      {{[
        '--node-external-ip ' + inventory_hostname
      ] + k3s_static_args 
      }}

- name: Build install command
  ansible.builtin.set_fact:
    k3s_install_command: "INSTALL_K3S_VERSION=\"{{ k3s_version }}\" K3S_URL=\"{{ k3s_url }}\" K3S_TOKEN=\"{{ k3s_token }}\" INSTALL_K3S_EXEC=\"{{ _k3s_exec_args | join(' ') }}\" sh {{ k3s_installer_path }}"

- name: Log install command
  ansible.builtin.debug:
    var: k3s_install_command