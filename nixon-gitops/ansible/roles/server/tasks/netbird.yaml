- name: Check whether NetBird is installed
  ansible.builtin.command: netbird version
  register: netbird_version
  changed_when: false
  failed_when: false

- name: Install NetBird when missing
  when: netbird_version.rc != 0
  block:
    - name: Download NetBird repository public key
      ansible.builtin.get_url:
        url: https://pkgs.netbird.io/debian/public.key
        dest: /tmp/netbird-public.key
        mode: "0644"

    - name: Install NetBird repository keyring
      ansible.builtin.command: >-
        gpg 
          --dearmor 
          --yes
          --output /usr/share/keyrings/netbird-archive-keyring.gpg
          /tmp/netbird-public.key
      args:
        creates: /usr/share/keyrings/netbird-archive-keyring.gpg

    - name: Configure NetBird apt repository
      ansible.builtin.deb822_repository:
        name: netbird
        types: deb
        uris: https://pkgs.netbird.io/debian
        suites: stable
        components: main
        signed_by: /usr/share/keyrings/netbird-archive-keyring.gpg
        state: present

    - name: Install NetBird package
      ansible.builtin.apt:
        name: netbird
        state: present
        update_cache: true
        lock_timeout: 60

- name: Check whether NetBird is configured
  ansible.builtin.stat:
    path: /etc/netbird/config.json
  register: netbird_config

- name: Connect machine to NetBird
  ansible.builtin.command: >-
    netbird up
      --setup-key {{ netbird_setup_key | quote }}
      --allow-server-ssh
      --enable-ssh-root
  when:
    - netbird_setup_key | trim | length > 0
    - not netbird_config.stat.exists
  changed_when: true
