- name: Refresh apt package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 60

- name: Install minimal required packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    lock_timeout: 60

- name: Upgrade installed packages
  ansible.builtin.apt:
    upgrade: dist
    lock_timeout: 60

- name: Remove unused packages
  ansible.builtin.apt:
    autoremove: true
    lock_timeout: 60

- name: Check whether a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required

- name: Reboot if needed
  ansible.builtin.reboot:
    reboot_timeout: 300
  when: reboot_required.stat.exists