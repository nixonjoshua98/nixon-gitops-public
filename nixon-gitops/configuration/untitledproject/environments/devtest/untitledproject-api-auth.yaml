nameOverride: untitledproject-api-auth

image: "sharedpersonalcontaineregistry.azurecr.io/untitledproject.api.auth:develop-20260712-225417-2a37f0b9"

resources:
  limits:
    memory: 180Mi
    cpu: 500m
  requests:
    memory: 140Mi
    cpu: 100m

ingress:
  enabled: true
  rules:
    - host: up-api.joshuanixon.dev
      paths:
        - path: /connect
          pathType: Prefix
        - path: /.well-known
          pathType: Prefix
        - path: /oauth2
          pathType: Prefix

hpa:
  enabled: true