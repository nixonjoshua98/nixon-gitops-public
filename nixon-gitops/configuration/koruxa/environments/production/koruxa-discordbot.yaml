nameOverride: koruxa-discordbot

image: "sharedpersonalcontaineregistry.azurecr.io/koruxa.discordbot:master-20260802-215036-546c343f"

resources:
  requests:
    memory: 80Mi
    cpu: 50m
  limits:
    memory: 120Mi
    cpu: 500m

extraEnvValues:
  - name: PG_PASSWORD
    externalSecretKeyRef:
      key: KORUXA-BOT-TOKEN

extraVolumes:
  - name: sqlite-data
    persistentVolumeClaim:
      claimName: "{{ .Release.Name }}-sqlite"

extraVolumeMounts:
  - name: sqlite-data
    mountPath: /mnt/sqlite

persistence:
  enabled: true
  claimName: "{{ .Release.Name }}-sqlite"
  storageClassName: local-path
  size: 1Gi

dotNetEnvironment: Production
