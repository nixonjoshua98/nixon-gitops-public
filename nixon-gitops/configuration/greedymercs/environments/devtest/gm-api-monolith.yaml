nameOverride: gm-api-monolith

image: "sharedpersonalcontaineregistry.azurecr.io/gm.api.monolith:develop-compat-20260712-175423-6a749433"

resources:
  limits:
    memory: 280Mi
    cpu: 500m
  requests:
    memory: 240Mi
    cpu: 100m

extraEnvValues:
  - name: PG_PASSWORD
    valueFrom:
      secretKeyRef:
        name: gm-api
        key: PG_PASSWORD
  - name: OpenIddict__DiscordClientSecret
    valueFrom:
      secretKeyRef:
        name: gm-api
        key: DISCORD_CLIENT_SECRET
  - name: OpenIddict__GoogleClientSecret
    valueFrom:
      secretKeyRef:
        name: gm-api
        key: GOOGLE_CLIENT_SECRET

containerPorts:
  http:
    enabled: true

readinessProbe:
  enabled: true

externalSecret:
  name: gm-api
  values:
    - secretKey: DISCORD_CLIENT_SECRET
      remoteRefKey: PRODUCTION-DISCORD-CLIENT-SECRET
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRefKey: PRODUCTION-GOOGLE-CLIENT-SECRET
    - secretKey: PG_PASSWORD
      remoteRefKey: PG-WEB-USER-PW

service:
  enabled: true
  ports:
    http:
      enabled: true

ingress:
  enabled: true
  rules:
    - host: api-devtest.greedymercs.com
      paths:
        - path: /
          pathType: Prefix

dotNetEnvironment: DevTest
