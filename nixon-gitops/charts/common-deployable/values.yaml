ingress:
  enabled: false

service:
  enabled: false
  ports:
    http:
      enabled: false
      port: 8080
      targetPort: http
      protocol: TCP
    metrics:
      enabled: false
      port: 9182
      targetPort: http
      protocol: TCP

imagePullSecret: null

containerPorts:
  http:
    enabled: false
    containerPort: 8080
  metrics:
    enabled: false
    containerPort: 9182

serviceMonitor:
  enabled: false

dotNetEnvironment: null

readinessProbe:
  enabled: false
  httpGet:
    path: /healthz/ready