apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common-deployable.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "common-deployable.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
{{- include "common-deployable.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
{{- include "common-deployable.selectorLabels" . | nindent 8 }}
    spec:
{{- if .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
{{- end }}

{{- if .Values.extraVolumes }}
      volumes:
{{- toYaml .Values.extraVolumes | nindent 8 }}
{{- end }}

      containers:
        - name: container
          image: {{ .Values.image | quote }}

{{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.httpGet.path }}
              port: http
            timeoutSeconds: 3
{{- end }}

{{- if .Values.resources }}     
          resources:   
{{- toYaml .Values.resources | nindent 12 }}
{{- end }}

{{- if .Values.containerPorts }}
          ports:
{{- range $name, $port := .Values.containerPorts }}
{{- if $port.enabled }}
            - name: {{ $name }}
              containerPort: {{ $port.containerPort }}
{{- end }}
{{- end }}
{{- end }}


{{- if .Values.securityContext }}
          securityContext:
{{- toYaml .Values.securityContext | nindent 12 }}
{{- end }}

          env:
            - name: DOTNET_hostBuilder:reloadConfigOnChange
              value: 'false'
{{- if .Values.dotNetEnvironment }}
            - name: DOTNET_ENVIRONMENT
              value: {{ .Values.dotNetEnvironment }}
{{- end }}
{{- if .Values.extraEnvValues }}
{{- toYaml .Values.extraEnvValues | nindent 12 }}
{{- end }}

{{- if .Values.extraVolumeMounts }}
          volumeMounts:
{{- toYaml .Values.extraVolumeMounts | nindent 12 }}
{{- end }}
