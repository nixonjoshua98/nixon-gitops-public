{{- if .Values.objectStore.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "nixon-cnpg-cluster.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "nixon-cnpg-cluster.labels" $ | indent 4 }}
spec:
  groups:
    - name: cnpg.cluster.backups
      rules:
        - alert: CNPGBackupFailed
          expr: |
            max by (namespace) (
              barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{
                namespace="{{ .Release.Namespace }}"
              }
            )
            >
            max by (namespace) (
              barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{
                namespace="{{ .Release.Namespace }}"
              }
            )
          for: 5m
          annotations:
            summary: "CNPG backup failed for {{ include "nixon-cnpg-cluster.name" . }}"
            description: "The most recent backup for {{ include "nixon-cnpg-cluster.name" . }} failed and no newer successful backup has been recorded."
{{- end }}
