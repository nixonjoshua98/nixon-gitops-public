{{- $name := printf "%s-rw" (include "nixon-cnpg-cluster.name" .) -}}
apiVersion: netbird.io/v1alpha1
kind: NetworkResource
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "nixon-cnpg-cluster.labels" . | indent 4 }}
spec:
  networkRouterRef:
    name: {{ .Values.netbirdResource.networkRouter }}
    namespace: {{ .Values.netbirdResource.namespace }}
  serviceRef:
    name: {{ $name }}
  groups:
    - name: All
