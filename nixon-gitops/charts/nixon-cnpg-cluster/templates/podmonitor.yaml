apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "nixon-cnpg-cluster.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "nixon-cnpg-cluster.labels" . | nindent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      cnpg.io/cluster: {{ include "nixon-cnpg-cluster.name" . }}
  podMetricsEndpoints:
    - port: metrics
      interval: 30s