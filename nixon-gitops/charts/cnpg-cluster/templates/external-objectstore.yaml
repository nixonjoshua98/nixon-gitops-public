{{- with .Values.externalObjectStore }}
{{- if .destinationPath }}
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ include "cnpg-cluster.externalObjectStore" $ }}
  namespace: {{ $.Release.Namespace }}
  labels:
{{ include "cnpg-cluster.labels" $ | indent 4 }}
spec:
  retentionPolicy: 7d
  configuration:
    data:
      compression: bzip2
    wal:
      compression: bzip2
    destinationPath: '{{ .destinationPath }}'
    azureCredentials:
      connectionString:
        name: {{ include "cnpg-cluster.externalObjectStore" $ }}
        key: CONNECTION_STRING
{{- end }}
{{- end }}
